name: AutoQE CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # Existing frozen-M0 tests compare against the historical checkpoint.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          # Only the deterministic loopback-preload test uses Node; no npm install.
          node-version: '22'
          package-manager-cache: false
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Compile and import sanity
        run: |
          python -m compileall -q src/autoqe autoqe_integration scripts
          python -I -c "import autoqe.metrics; import autoqe_integration.contracts; import autoqe_integration.providers.agentguard"
      - name: Deterministic suite including architecture boundaries
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Build and validate wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/verify_wheel.py dist
      - name: Verify installed wheel imports
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -I -c "import autoqe.metrics; import autoqe_integration.contracts; import autoqe_integration.providers.agentguard"
